name: Add Earth Texture For Orbital Scene
on:
  workflow_dispatch:
  push:
    branches: [feature/director4-graphics-toolkit]
    paths:
      - '.github/workflows/director4-earth-texture.yml'
permissions:
  contents: write
jobs:
  texture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: director4-graphics
    steps:
      - uses: actions/checkout@v4
      - name: Acquire Earth equirectangular reference texture
        run: |
          mkdir -p public/textures
          curl --fail --location --retry 3 --max-time 90 \
            'https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/textures/planets/earth_atmos_2048.jpg' \
            -o public/textures/earth_atmos_2048.jpg
          file public/textures/earth_atmos_2048.jpg
          test $(stat -c%s public/textures/earth_atmos_2048.jpg) -gt 100000
      - name: Record source attribution and publish resource
        run: |
          printf 'Earth day texture: Three.js r160 example planets/earth_atmos_2048.jpg, based on NASA global imagery. Source: https://github.com/mrdoob/three.js/tree/r160/examples/textures/planets. Use only as a background texture, not as terrain physics.\n' > public/textures/EARTH_SOURCE.txt
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add director4-graphics/public/textures/earth_atmos_2048.jpg director4-graphics/public/textures/EARTH_SOURCE.txt
          git commit -m 'Add realistic Earth backdrop texture for Crystal Palace fidelity scenes'
          git fetch origin feature/director4-graphics-toolkit
          git rebase origin/feature/director4-graphics-toolkit
          git push origin HEAD:feature/director4-graphics-toolkit
