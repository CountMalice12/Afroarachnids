name: Record Crystal Palace Authored Asset Gameplay
on:
  push:
    branches: [feature/director4-graphics-toolkit]
    paths:
      - '.github/workflows/director4-fidelity-video.yml'
      - 'director4-graphics/tests/record-fidelity.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: director4-graphics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install rendering dependencies and recorder
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Run actual browser and record 3D scene
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/d4-fidelity-vite.log 2>&1 &
          sleep 6
          timeout 460s node tests/record-fidelity.mjs
      - name: Archive finished video and original browser screencast
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director4-authored-palace-gameplay-video
          path: |
            director4-graphics/test-artifacts/Director4_CrystalPalace_Authored_Assets_Gameplay.mp4
            director4-graphics/test-artifacts/fidelity-video/*.webm
          if-no-files-found: ignore
      - name: Publish video into feature branch
        if: success()
        run: |
          mkdir -p demo
          cp test-artifacts/Director4_CrystalPalace_Authored_Assets_Gameplay.mp4 demo/Director4_CrystalPalace_Authored_Assets_Gameplay.mp4
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add director4-graphics/demo/Director4_CrystalPalace_Authored_Assets_Gameplay.mp4
          git commit -m 'Add live authored GLB Crystal Palace gameplay footage'
          git fetch origin feature/director4-graphics-toolkit
          git rebase origin/feature/director4-graphics-toolkit
          git push origin HEAD:feature/director4-graphics-toolkit
